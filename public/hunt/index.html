<title>그을음송곳니 토벌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 화면 전체가 달 없는 밤의 사냥터, 그 위에 사냥 장비 같은 HUD를 얹은 단일 화면 게임. 의도적으로 어두운 단일 테마 */
:root{
  --night:#08090e;
  --panel:rgba(10,12,18,.8);
  --line:rgba(236,228,212,.16);
  --bone:#ece4d4;
  --ash:#979ca8;
  --ember:#ff9a4a;
  --ember-deep:#c4561c;
  --blood:#cf4a3c;
  --stam:#e8c45c;
  --display:'Gowun Batang','Nanum Myeongjo','Batang',serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Black Han Sans','IBM Plex Sans KR','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.vitals{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 36px));display:grid;gap:6px}
.who{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:15px;letter-spacing:.02em;text-shadow:0 1px 2px #000}
.who span{font-family:var(--body);font-size:11px;letter-spacing:.14em;color:var(--ash)}
.bar{position:relative;height:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);overflow:hidden}
.bar i,.bar b{position:absolute;left:0;top:0;bottom:0;display:block}
.bar.hp{height:14px}
.bar.hp i{background:linear-gradient(180deg,#e2614f,var(--blood));z-index:2}
.bar.hp b{background:rgba(236,228,212,.5);z-index:1}
.bar.st{height:8px;width:82%}
.bar.st i{background:linear-gradient(180deg,#f2d77e,var(--stam))}
.sub{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ash)}
.charge{display:flex;gap:5px;align-items:center}
.charge em{width:16px;height:6px;background:rgba(255,255,255,.12);transform:skewX(-20deg)}
.charge em.on{background:var(--ember);box-shadow:0 0 8px var(--ember)}
.charge.full em.on{background:#ffdcae}
.target{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;display:grid;gap:5px;justify-items:center;width:min(360px,56vw)}
.tname{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-shadow:0 1px 3px #000}
.tstate{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:19px}
.tag{font-size:11px;padding:1px 7px;border:1px solid var(--line);background:var(--panel);letter-spacing:.06em;color:var(--bone)}
.tag.rage{border-color:var(--blood);color:#ffb3a8}
.tag.part{border-color:var(--ember-deep);color:var(--ember)}
.bar.mhp{width:100%;height:6px}
.bar.mhp i{background:var(--ember)}
.debug{font-size:11px;line-height:1.5;color:var(--ash);background:var(--panel);padding:4px 8px;text-align:left;white-space:pre}
.timer{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));font-family:var(--num);font-size:22px;letter-spacing:.04em;text-shadow:0 1px 3px #000}
.keys{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ash);max-width:min(760px,calc(100vw - 36px));text-shadow:0 1px 2px #000}
.keys b{font-weight:600;color:var(--bone);margin-right:4px}
.banner{position:absolute;left:50%;top:22%;font-family:var(--display);font-size:clamp(24px,4vw,36px);letter-spacing:.08em;color:var(--ember);text-shadow:0 0 18px rgba(255,140,60,.55),0 2px 4px #000;opacity:0;white-space:nowrap;transform:translateX(-50%)}
.toast{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;background:var(--panel);border:1px solid var(--line);padding:7px 14px;opacity:0;transition:opacity .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
.reticle{position:absolute;left:0;top:0;width:34px;height:34px;border:2px solid var(--ember);border-radius:50%;box-shadow:0 0 10px rgba(255,140,60,.6)}
.reticle::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--ember)}
#nums{position:absolute;inset:0;overflow:hidden}
.num{position:absolute;left:0;top:0;font-family:var(--num);font-size:21px;color:var(--bone);text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);will-change:transform,opacity;white-space:nowrap}
.num.weak{color:#ffa64c}
.num.big{font-size:31px}
.num.info{font-family:var(--body);font-weight:600;font-size:14px;color:#d6e6ff;letter-spacing:.06em}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,10,.78) 100%);opacity:0}
[hidden]{display:none!important}
#hud.town .target,#hud.town .timer{display:none}
.prompt{position:absolute;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;background:var(--panel);border:1px solid var(--line);font-size:14px;letter-spacing:.03em;white-space:nowrap;display:flex;align-items:center;gap:10px}
.chat{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 36px));display:grid;gap:6px;font-size:13px}
#chatLog{display:grid;gap:3px;align-content:end}
#chatLog div{background:rgba(8,9,14,.6);padding:3px 9px;justify-self:start;max-width:100%;overflow-wrap:anywhere;line-height:1.5;transition:opacity .8s}
#chatLog div.old{opacity:0}
.chat.open #chatLog div.old{opacity:.85}
#chatLog .ch{color:var(--ember);margin-right:6px;font-size:11.5px}#chatLog .ch.party,#chatCh.party{color:#9fd0ff}
#chatLog b{font-weight:600;color:#ffe2b8}
#chatLog .sys{color:var(--ash)}
#chatBar{display:flex;gap:10px;align-items:center;pointer-events:auto;background:rgba(8,9,14,.88);border:1px solid var(--ember-deep);padding:6px 10px}
#chatBar input{flex:1;font:inherit;font-size:14px;background:transparent;border:0;color:var(--bone);outline:none;min-width:0}
#chatCh{font-size:12px;font-weight:600;color:var(--ember);white-space:nowrap}
.ntag{text-align:center}
.ntag i{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--bone);background:rgba(8,9,14,.75);border:1px solid var(--line);padding:3px 9px;margin:0 auto 4px;max-width:240px;width:max-content;white-space:normal;line-height:1.45}
#overlay.side{place-items:center end;background:linear-gradient(270deg,rgba(8,9,14,.95) 0%,rgba(8,9,14,.84) 34%,rgba(8,9,14,0) 64%)}
#overlay.side .card{width:min(460px,100%)}
@media (max-width:760px){#overlay.side{place-items:end center;background:linear-gradient(0deg,rgba(8,9,14,.96) 0%,rgba(8,9,14,.85) 55%,rgba(8,9,14,0) 100%)}}
.slots{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.slots .lab{font-size:12px;letter-spacing:.14em;color:var(--ash)}
.slot{display:flex;gap:8px;flex-wrap:wrap}
.slot button{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0;padding:6px 12px;background:rgba(255,255,255,.05);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
.slot button[aria-pressed="true"]{background:var(--bone);color:#16120d;box-shadow:none}
.slot button:disabled{opacity:.42;cursor:not-allowed}
.quest{display:grid;gap:5px;padding:12px 14px;background:rgba(255,255,255,.04);border-left:3px solid var(--ember)}
.quest b{font-family:var(--display);font-size:21px;font-weight:700}
.slot .need{flex-basis:100%;font-size:12px;color:var(--ash)}.ok{color:#cfe6b0}.no{color:var(--ash)}.need .no{color:#c98f84}
.slot button.craft{background:rgba(255,154,74,.14);color:var(--ember);box-shadow:inset 0 0 0 1px var(--ember-deep)}
.gstat{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;align-items:flex-start}.gstat b{font-family:var(--num);font-weight:400;font-size:26px;margin:0 6px}.gstat .lab{font-size:12px;letter-spacing:.14em;color:var(--ash)}
.loot{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:14px}.loot .lab{font-size:12px;letter-spacing:.14em;color:var(--ash)}.loot b{font-weight:600;padding:3px 10px;background:rgba(255,154,74,.12);border:1px solid var(--ember-deep)}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding-block:16px;padding-inline:16px;background:radial-gradient(ellipse at 50% 60%,rgba(8,9,14,.3),rgba(8,9,14,.9));z-index:5;overflow:auto}
.card{width:min(560px,100%);display:grid;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--ember)}
.card h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.02em}
.card p{margin:0;line-height:1.7;color:#d2cbbd;max-width:52ch}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:center}
kbd{font-family:var(--body);font-size:11.5px;font-weight:600;padding:2px 8px;border:1px solid var(--line);border-bottom-width:2px;background:rgba(255,255,255,.04);color:var(--bone);white-space:nowrap;justify-self:start}
.ctrl span{color:#d2cbbd}
.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
button{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.06em;color:#1c0e05;background:var(--ember);border:0;padding:11px 28px;cursor:pointer;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
button:hover{background:#ffb272}
button:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.note{font-size:12px;color:var(--ash);line-height:1.6}
.pick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#overlay input{font:inherit;font-size:15px;padding:7px 10px;background:rgba(255,255,255,.06);color:var(--bone);border:1px solid var(--line);min-width:0}
.plist{display:grid;gap:6px;font-size:14px;color:#d2cbbd}.plist ul{margin:6px 0 0;padding-inline-start:18px}.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,.04)}
.prow button{font-size:14px;padding:6px 16px}
.ntag{position:absolute;left:0;top:0;font-size:12px;font-weight:600;color:#ffe2b8;text-shadow:0 1px 3px #000;white-space:nowrap;pointer-events:none;will-change:transform}
button.ghost{background:rgba(255,255,255,.06);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
button.ghost:hover{background:rgba(255,255,255,.13)}
.binds{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;font-size:13px;color:#d2cbbd;max-height:52vh;overflow:auto;padding-inline-end:4px}
.binds button.bind{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:0;padding:5px 12px;min-width:120px;background:rgba(255,255,255,.05);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line);clip-path:none}
.binds button.bind.wait{background:var(--ember);color:#1c0e05}
.pick .lab{font-size:12px;letter-spacing:.14em;color:var(--ash);margin-inline-end:4px}
.pick button{font-size:15px;padding:8px 20px;background:rgba(255,255,255,.05);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
.pick button:hover{background:rgba(255,255,255,.12)}
.pick button[aria-pressed="true"]{background:var(--bone);color:#16120d;box-shadow:none}
@media (min-width:900px){#overlay.title{place-items:center start;padding-inline:6vw;background:linear-gradient(90deg,rgba(8,9,14,.94) 0%,rgba(8,9,14,.82) 42%,rgba(8,9,14,.12) 72%,rgba(8,9,14,0) 100%)}}
.stat{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--ash)}
.stat strong{font-family:var(--num);font-weight:400;font-size:28px;color:var(--bone);display:block;letter-spacing:.03em}
@media (max-width:640px){.keys{display:none}.target{top:calc(76px + env(safe-area-inset-top,0px));width:calc(100vw - 32px)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div id="stage"></div>
<div id="hud" hidden>
  <div class="vitals">
    <div class="who">사냥꾼 <span id="drawState">납도</span></div>
    <div class="bar hp"><i id="hpFill"></i><b id="hpLag"></b></div>
    <div class="bar st"><i id="stFill"></i></div>
    <div class="sub"><span id="potions">회복약 10</span><span class="charge" id="charge" aria-label="모아베기 단계"><em></em><em></em><em></em></span></div>
  </div>
  <div class="target">
    <div class="tname">그을음송곳니</div>
    <div class="tstate" id="tstate"></div>
    <div class="bar mhp" id="mhpWrap" hidden><i id="mhpFill"></i></div>

  <div class="chat" id="chat"><div id="chatLog" aria-live="polite"></div><div id="chatBar" hidden><span id="chatCh">마을</span><input id="chatIn" maxlength="120" autocomplete="off" aria-label="채팅 입력" placeholder="할 말을 입력하고 Enter"></div></div>

</div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){ $('overlay').innerHTML='<div class="card"><h1>불러오기 실패</h1><p>3D 엔진을 불러오지 못했어요. 페이지를 새로고침해 주세요.</p></div>'; return; }

/* ---------- 기본 도구 ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const dampA=(a,b,l,dt)=>wrapA(a+wrapA(b-a)*(1-Math.exp(-l*dt)));
const rand=(a,b)=>a+Math.random()*(b-a);
const smooth=x=>x*x*(3-2*x);
const ease={lin:t=>t,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const V=()=>new THREE.Vector3();
const _a=V(),_b=V(),_c=V(),_d=V(),_e=V(),_fwd=V(),_dir=V(),_pv=V();
const _pq=new THREE.Quaternion();
const UP=new THREE.Vector3(0,1,0);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 렌더러와 장면 ---------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06080e);
scene.fog=new THREE.FogExp2(0x06080e,0.019);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,320);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const hemi=new THREE.HemisphereLight(0x5a6d96,0x0c0d12,0.78); scene.add(hemi);
const sky=new THREE.DirectionalLight(0x8fa4d2,0.58);
sky.castShadow=true; sky.shadow.mapSize.set(2048,2048);
Object.assign(sky.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:120});
sky.shadow.bias=-0.0006; scene.add(sky); scene.add(sky.target);

const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:0.88,metalness:0.04},o||{}));
function mesh(geo,m,cast,recv){const x=new THREE.Mesh(geo,m);x.castShadow=cast!==false;x.receiveShadow=!!recv;return x;}
function placeBetween(m,a,b){_pv.subVectors(b,a);const L=_pv.length()||0.001;m.position.addVectors(a,b).multiplyScalar(0.5);_pq.setFromUnitVectors(UP,_pv.multiplyScalar(1/L));m.quaternion.copy(_pq);m.scale.set(1,L,1);}
function taper(geo,fz,min){const p=geo.attributes.position;for(let i=0;i<p.count;i++){const z=p.getZ(i);if(z>0){const s=Math.max(min,1-z*fz);p.setX(i,p.getX(i)*s);p.setY(i,p.getY(i)*s);}}geo.computeVertexNormals();return geo;}

/* 세계: 사냥터와 마을을 각각 묶어 두고 보이기만 바꿈 */
const HUNTW=new THREE.Group();scene.add(HUNTW);const WORLD={cur:'hunt'};

/* ---------- 사냥터 ---------- */
(function buildGround(){
  const R=rng(7);
  const g=new THREE.PlaneGeometry(220,220,90,90); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, col=[];
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),r=Math.hypot(x,z);
    let y=(R()-0.5)*0.1; if(r>60) y+=(r-60)*0.05*R()+R()*0.7; p.setY(i,y);
    const inA=r<55?1:Math.max(0,1-(r-55)/12), n=R()*0.012;
    col.push(lerp(0.035,0.075,inA)+n,lerp(0.038,0.07,inA)+n,lerp(0.05,0.072,inA)+n);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  HUNTW.add(mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}),false,true));
})();
const colliders=[];
const rockGeo=new THREE.DodecahedronGeometry(1,0);
(function buildDecor(){
  const R=rng(20261003), rockA=mat(0x2b2e35), rockB=mat(0x23252b), wood=mat(0x1b1714);
  for(let i=0;i<46;i++){const a=R()*TAU,r=57+R()*20,s=0.8+R()*3.2;const m=mesh(rockGeo,R()<.5?rockA:rockB,true,true);m.position.set(Math.cos(a)*r,s*0.35,Math.sin(a)*r);m.scale.set(s*(0.8+R()*.6),s*(0.6+R()*.7),s*(0.8+R()*.6));m.rotation.set(R()*3,R()*3,R()*3);HUNTW.add(m);}
  for(let i=0;i<30;i++){const a=R()*TAU,r=62+R()*30,h=5+R()*7,g=new THREE.Group();g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    const tr=mesh(new THREE.CylinderGeometry(0.18,0.45,h,5),wood);tr.position.y=h/2;tr.rotation.z=(R()-.5)*0.2;g.add(tr);
    for(let k=0;k<3;k++){const bl=1.5+R()*2.5,br=mesh(new THREE.CylinderGeometry(0.05,0.15,bl,4),wood);br.position.set(0,h*(0.5+R()*0.4),0);br.rotation.set((R()-.5)*1.6,R()*TAU,0.8+R()*0.6);br.translateY(bl/2);g.add(br);}
    HUNTW.add(g);}
  [[18,-24,2.4],[-27,8,2.8],[9,31,2.0],[-14,-34,1.6]].forEach(([x,z,r])=>{const m=mesh(rockGeo,rockA,true,true);m.position.set(x,r*0.45,z);m.scale.set(r,r*0.8,r*0.95);m.rotation.y=x;HUNTW.add(m);colliders.push({x,z,r:r*0.95});});
})();

const DOT=(function(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.35,'rgba(255,255,255,.7)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
function Particles(n,size,additive){
  this.n=n;this.pos=new Float32Array(n*3);this.col=new Float32Array(n*3);this.base=new Float32Array(n*3);this.vel=new Float32Array(n*3);this.life=new Float32Array(n);this.max=new Float32Array(n);this.grav=new Float32Array(n);this.i=0;
  for(let k=0;k<n;k++)this.pos[k*3+1]=-999;
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));g.setAttribute('color',new THREE.BufferAttribute(this.col,3));this.geo=g;
  const m=new THREE.PointsMaterial({size,map:DOT,vertexColors:true,transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending,sizeAttenuation:true,opacity:additive?1:0.5});
  const pts=new THREE.Points(g,m);pts.frustumCulled=false;scene.add(pts);
}
Particles.prototype.spawn=function(p,vx,vy,vz,life,r,g,b,grav){const k=this.i;this.i=(this.i+1)%this.n;const j=k*3;this.pos[j]=p.x;this.pos[j+1]=p.y;this.pos[j+2]=p.z;this.vel[j]=vx;this.vel[j+1]=vy;this.vel[j+2]=vz;this.life[k]=life;this.max[k]=life;this.base[j]=r;this.base[j+1]=g;this.base[j+2]=b;this.grav[k]=grav==null?9:grav;};
Particles.prototype.update=function(dt){const dr=Math.exp(-1.5*dt);for(let k=0;k<this.n;k++){if(this.life[k]<=0)continue;const j=k*3;this.life[k]-=dt;if(this.life[k]<=0){this.pos[j+1]=-999;this.col[j]=this.col[j+1]=this.col[j+2]=0;continue;}
  this.vel[j+1]-=this.grav[k]*dt;this.vel[j]*=dr;this.vel[j+2]*=dr;this.pos[j]+=this.vel[j]*dt;this.pos[j+1]+=this.vel[j+1]*dt;this.pos[j+2]+=this.vel[j+2]*dt;
  if(this.pos[j+1]<0.03){this.pos[j+1]=0.03;this.vel[j+1]*=-0.3;this.vel[j]*=0.6;this.vel[j+2]*=0.6;}
  const f=this.life[k]/this.max[k];this.col[j]=this.base[j]*f;this.col[j+1]=this.base[j+1]*f;this.col[j+2]=this.base[j+2]*f;}
  this.geo.attributes.position.needsUpdate=true;this.geo.attributes.color.needsUpdate=true;};

let AC=null,master=null,NB=null;
function initAudio(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.6;const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;master.connect(comp);comp.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function envG(t,a,peak,d){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);g.connect(master);return g;}
function nz(type,f0,f1,q,peak,a,d){if(!AC)return;const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+a+d);f.Q.value=q;s.connect(f);f.connect(envG(t,a,peak,d));s.start(t,Math.random()*1.2);s.stop(t+a+d+0.05);}
function osc(type,f0,f1,peak,a,d,lp){if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+a+d);let node=o;if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);node=f;}node.connect(envG(t,a,peak,d));o.start(t);o.stop(t+a+d+0.05);}

    if(c.box){let lx=dx*c.c-dz*c.s,lz=dx*c.s+dz*c.c;const ex=c.hw+0.36,ez=c.hd+0.36;if(Math.abs(lx)<ex&&Math.abs(lz)<ez){if(ex-Math.abs(lx)<ez-Math.abs(lz))lx=(lx<0?-1:1)*ex;else lz=(lz<0?-1:1)*ez;P.pos.x=c.x+lx*c.c+lz*c.s;P.pos.z=c.z-lx*c.s+lz*c.c;}}
    else{const min=c.r+0.38,d2=dx*dx+dz*dz;if(d2<min*min){const d=Math.sqrt(d2)||0.001;P.pos.x=c.x+dx/d*min;P.pos.z=c.z+dz/d*min;}}}
  const r=Math.hypot(P.pos.x,P.pos.z);if(r>25){P.pos.x*=25/r;P.pos.z*=25/r;}}

  return '<div class="loot"><span class="lab">얻은 소재</span>'+Object.keys(sum).map(k=>'<b>'+ITEMS[k]+' ×'+sum[k]+'</b>').join('')+'</div>';}

function nameFieldHTML(){return '<div class="pick"><span class="lab">이름</span><input id="netName" maxlength="12" value="'+esc(NET.name)+'" placeholder="사냥꾼 이름" aria-label="사냥꾼 이름"></div>';}
function equipHTML(){const sx=SKIN.want;const inv=Object.keys(ITEMS).map(k=>ITEMS[k]+' '+INV[k]).join(' · ');
  return '<div class="eyebrow">장비 천막</div><h1>사냥꾼 장비</h1>'+nameFieldHTML()+
  '<div class="pick" role="group" aria-label="사냥꾼 선택"><span class="lab">사냥꾼</span><button data-skin="m" aria-pressed="'+(sx==='m')+'">남자</button><button data-skin="f" aria-pressed="'+(sx==='f')+'">여자</button><span class="note" id="skinNote">'+skinNoteText()+'</span></div>'+
  '<div class="slots">'+SLOTS.map(([k,lab])=>{const own=owns('soot',k);const sb=own?'<button data-slot="'+k+'" data-set="soot" aria-pressed="'+(EQUIP[k]==='soot')+'">'+ARMOR.soot.names[k]+'</button>':'<button class="craft" data-craft="'+k+'"'+(canCraft(k)?'':' disabled')+'>'+ARMOR.soot.names[k]+' 만들기</button>';
    return '<span class="lab">'+lab+'</span><div class="slot"><button data-slot="'+k+'" data-set="basic" aria-pressed="'+(EQUIP[k]==='basic')+'">'+ARMOR.basic.name[sx]+'</button>'+sb+(own?'':'<span class="need">'+recipeText(k)+'</span>')+'</div>';}).join('')+'</div>'+
  '<div class="gstat"><span><span class="lab">방어력</span><b>'+EQ_STAT.def+'</b> <span class="note">받는 피해 '+Math.round((1-EQ_STAT.mult)*100)+'% 줄임</span></span><span class="note">그을음송곳니 세트 '+EQ_STAT.soot+'/5<br>'+setBonusText()+'</span></div>'+
  '<p class="note">가진 소재: '+inv+'</p><div class="actions"><button data-act="close">닫기</button><span class="note">Esc로도 닫혀요</span></div>';}
function bindEquipPanel(){for(const b of overlay.querySelectorAll('[data-craft]'))b.addEventListener('click',()=>{craft(b.dataset.craft);showOverlay('equip');});}
function boardHTML(){return '<div class="eyebrow">'+(TOWN.from==='gate'?'출발 문':'퀘스트 게시판')+'</div><h1>토벌 의뢰</h1>'+
  '<div class="quest"><b>그을음송곳니 토벌</b><span class="note">숯처럼 검은 털의 거대 수인종. 머리는 약점, 다리를 노리면 넘어지고, 꼬리는 자를 수 있다.</span><span class="note">사냥터: 잿빛 분지 · 혼자 또는 최대 4명 · 파티는 세 번 쓰러지면 실패 · 인원이 많을수록 몬스터가 강해짐</span><span class="note">보상: 그을음 가죽 · 송곳니, 뿔 파괴 시 잿빛 뿔, 꼬리 절단 시 불씨 꼬리털, 드물게 잉걸 보주. 토벌 후 '+keyName(BIND.interact)+' 키로 갈무리</span></div>'+
  '<div id="lobbyBody"></div>'+nameFieldHTML()+'<div class="actions"><button class="ghost" data-act="close">닫기</button><span class="note">Esc로도 닫혀요</span></div>';}

/* 채팅 (마을 · 파티) */
const chatEl=$('chat'),chatLog=$('chatLog'),chatBar=$('chatBar'),chatIn=$('chatIn'),chatCh=$('chatCh');
function chatChName(){return CHAT.ch==='party'?'파티':'마을';}
function openChat(){if(NET.state!=='on'){toast('서버에 연결되어 있을 때만 채팅할 수 있어요',1.8);return;}
  if(NET.inHunt)CHAT.ch='party';else if(CHAT.ch==='party'&&!NET.party)CHAT.ch='town';
  CHAT.open=true;input.keys.clear();chatBar.hidden=false;chatEl.classList.add('open');chatCh.textContent=chatChName();chatCh.className=CHAT.ch;chatIn.value='';try{chatIn.focus({preventScroll:true});}catch(e){}}
function closeChat(){if(!CHAT.open)return;CHAT.open=false;chatBar.hidden=true;chatEl.classList.remove('open');try{chatIn.blur();}catch(e){}}
function sendChat(){const m=String(chatIn.value||'').trim().slice(0,120);if(m)netSend({t:'chat',ch:CHAT.ch,m});closeChat();}
function chatSwitch(){if(NET.inHunt)return;CHAT.ch=CHAT.ch==='town'&&NET.party?'party':'town';chatCh.textContent=chatChName();chatCh.className=CHAT.ch;}
function addChat(ch,name,msg){const d=document.createElement('div');if(ch==='sys'){d.className='sys';d.textContent=msg;}
  else{const c=document.createElement('span');c.className='ch '+ch;c.textContent=ch==='party'?'[파티]':'[마을]';const n=document.createElement('b');n.textContent=name+' ';const m=document.createElement('span');m.textContent=msg;d.appendChild(c);d.appendChild(n);d.appendChild(m);}
  d.dataset.t=String(performance.now()/1000);chatLog.appendChild(d);while(chatLog.children.length>10)chatLog.removeChild(chatLog.firstChild);}
function onChat(o){const m=String(o.m||'').slice(0,120),n=String(o.n||'사냥꾼').slice(0,12);if(!m)return;addChat(o.ch==='party'?'party':'town',n,m);
  const r=NET.peers.get(o.f);if(r){r.say=m;r.sayT=performance.now()/1000+6;setTag(r);}}
function updateChatFade(){const t=performance.now()/1000;for(const d of chatLog.children){const old=t-(+d.dataset.t)>14;if(old!==d.classList.contains('old'))d.classList.toggle('old',old);}}
function setTag(r){r.tag.innerHTML=(r.say?'<i>'+esc(r.say)+'</i>':'')+esc(r.name);}

/* 마을 동시 접속: 위치를 초당 10번 보내고, 4초 동안 소식이 없으면 지움 */
function netTownTick(rdt){const ns=performance.now()/1000;if(NET.state==='on'&&!NET.inHunt){if(ns-(NET.lstAt||0)>=0.1){NET.lstAt=ns;
    netSend({t:'lst',p:[r2(P.pos.x),r2(P.pos.y),r2(P.pos.z)],y:r3(P.yaw),c:CH.map(k=>r3(P.cur[k])),w:H.swordInHand?1:0,b:H.bottle.visible?1:0,dead:0,sp:r2(P.moveSpeed||0),x:SKIN.want,e:eqCode(EQUIP)});}}
  for(const r of [...NET.peers.values()])if(r.lastT&&ns-r.lastT>5)netRemovePeer(r.id);
  netUpdatePeers(rdt);}
function netTownState(o){if(NET.inHunt||WORLD.cur!=='town'||o.f===NET.id||!Array.isArray(o.p)||!Array.isArray(o.c))return;let r=NET.peers.get(o.f);
  if(!r){netAddPeer({id:o.f,name:String(o.n||'사냥꾼').slice(0,12),sex:o.x});r=NET.peers.get(o.f);}
  else if(o.n&&o.n!==r.name){r.name=String(o.n).slice(0,12);setTag(r);}
  netPeerState(o);}

/* 세계 오가기 */
function placeTown(){P.pos.set(rand(-1.2,1.2),0,-6.5);P.yaw=0;camYaw=0;camPitch=0.26;camTarget.set(P.pos.x,1.6,P.pos.z);look.copy(camTarget);applyPose();}
function goTown(){closeChat();TOWN.panel=null;setWorld('town');resetAll();placeTown();game.state='play';overlay.hidden=true;overlay.classList.remove('side','title');hud.hidden=false;initAudio();requestLock();ctrlSafety();
  if(!NET.ws&&/^https?:$/.test(location.protocol))netConnect();
  if(!TOWN.greeted){TOWN.greeted=true;showBanner('사냥꾼의 마을');setTimeout(()=>{if(WORLD.cur==='town')toast('게시판에서 의뢰를 받고, 장비 천막에서 모습을 바꿀 수 있어요',3.2);},1500);}}
function leaveTown(){closeChat();if(NET.ws){netSend({t:'pleave'});netDisconnect();}NET.party=null;NET.parties=[];setWorld('hunt');resetAll();game.state='title';showOverlay('title');}
function startSoloHunt(){closeChat();TOWN.panel=null;if(NET.party)netSend({t:'pleave'});setWorld('hunt');resetAll();startGame();showBanner('그을음송곳니 토벌');}
function townFrame(rdt){let sdt=rdt;if(hitstop>0){hitstop-=rdt;sdt=rdt*0.05;}time+=sdt;
  updatePlayer(sdt);updateDummies(sdt);computeBlade();checkTownHit();updateTrail(sdt);updateFx(sdt,rdt);updateTownFx(rdt);
  if(game.state==='panel'&&TOWN.panel==='equip')showCamera(rdt);else updateCamera(rdt);
  updateHUD(rdt);updatePrompt();netTownTick(rdt);}
/* ---------- 루프 ---------- */
let last=performance.now()/1000;
function frame(){requestAnimationFrame(frame);stepSkinJob();const t=performance.now()/1000,rdt=Math.min(0.05,t-last);last=t;now=t;const st=game.state;
  if(WORLD.cur==='town')townFrame(rdt);
  else if(st==='play'||st==='win'||st==='lose'){let sdt=rdt;if(hitstop>0){hitstop-=rdt;sdt=rdt*0.035;}if(slowT>0){slowT-=rdt;sdt*=0.3;}time+=sdt;if(st==='play')game.elapsed+=rdt;
    if(NET.inHunt)netTick(rdt,sdt);
    updatePlayer(sdt);updateMonster(sdt);computeBlade();checkPlayerHit();updateTrail(sdt);updateFx(sdt,rdt);updateCamera(rdt);updateHUD(rdt);
    updatePrompt();
    if(st!=='play'){game.endTimer+=rdt;const carving=st==='win'&&(game.carveMon>0||game.carveTail>0||(P.act&&P.act.name==='carve'))&&game.endTimer<45;if(game.endTimer>2.6&&!carving&&overlay.hidden){showOverlay(st);if(document.exitPointerLock&&locked)document.exitPointerLock();}}}
  else if(st==='title'||(st==='keys'&&game.prevState==='title')){time+=rdt;updatePlayer(rdt);updateMonster(rdt);updateFx(rdt,rdt);titleCamera();}
  renderer.render(scene,camera);}
if(window.__HUNT_TEST)window.__hunt={NET,netConnect,netSend,M,P,game,applyMonsterDamage,goTown,leaveTown,startSoloHunt,openPanel,closePanel,TOWN,WORLD,CHAT,openChat,sendChat,addChat,EQUIP,input,BIND,townInteract,camera,netEndHunt,INV,OWN,craft,M,killMonster:()=>{M.hp=0;applyMonsterDamage('head',1,false);},doInteract,setCam:(y,p)=>{camYaw=y;camPitch=p;},skinNow:()=>{for(let i=0;i<20000&&(SKIN.job||SKIN.need.size);i++)stepSkinJob();return SKIN.on;},tick:(n,dt)=>{for(let i=0;i<n;i++){const d=dt||1/60;time+=d;if(WORLD.cur==='town')townFrame(d);else{updatePlayer(d);updateMonster(d);computeBlade();checkPlayerHit();updateTrail(d);updateFx(d,d);updateCamera(d);updateHUD(d);updatePrompt();}}}};
resetAll();pickSkin(SKIN.want);updateKeysHint();showOverlay('title');requestAnimationFrame(frame);
})();
</script>
